<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal KRL Jogja</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --accent: #ec4899;
            --dark: #1e293b;
            --light: #f8fafc;
            --gray: #64748b;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            min-height: 100vh;
            color: var(--dark);
            overflow-x: hidden;
        }

        .glass-morphism {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .tab-indicator {
            position: absolute;
            bottom: 0;
            height: 3px;
            background: var(--primary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 3px 3px 0 0;
        }

        .train-card {
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px -5px rgba(0, 0, 0, 0.1), 0 4px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .train-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent, rgba(99, 102, 241, 0.1), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .train-card:hover::before {
            transform: translateX(100%);
        }

        .train-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .pulse-animation {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(99, 102, 241, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(99, 102, 241, 0);
            }
        }

        .progress-fill {
            transition: width 1s linear;
        }

        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .route-line {
            position: relative;
            padding-left: 24px;
        }

        .route-line::before {
            content: '';
            position: absolute;
            left: 7px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, var(--primary), var(--secondary));
        }

        .route-point {
            position: relative;
        }

        .route-point::before {
            content: '';
            position: absolute;
            left: -24px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: white;
            border: 3px solid var(--primary);
            z-index: 1;
        }

        .route-point.active::before {
            background: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
        }

        .floating-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .floating-button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 30px rgba(99, 102, 241, 0.6);
        }

        .time-display {
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
        }

        .blink {
            animation: blink-animation 1.5s infinite;
        }

        @keyframes blink-animation {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .urgent {
            animation: urgent-pulse 1s infinite;
        }

        @keyframes urgent-pulse {
            0% { color: inherit; }
            50% { color: var(--danger); }
            100% { color: inherit; }
        }

        .loading-skeleton {
            height: 100px;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        @media (max-width: 640px) {
            .train-card {
                padding: 16px !important;
            }
            
            .route-line {
                padding-left: 20px;
            }
            
            .route-point::before {
                left: -20px;
                width: 12px;
                height: 12px;
            }
            
            .route-line::before {
                left: 6px;
            }
        }
    </style>
</head>
<body>

<center><div class="text-sm text-gray-500">Berangkat Dari Stasiun :</div></center>

        // State for filter
        let showAllSchedules = true;
        let currentKrlDirection = 'solo-jogja'; // Track current KRL direction
        let currentKeretaDirection = 'pergi'; // Track current Kereta direction

        // Helper functions
        function timeToMinutes(time) {
            const [h, m] = time.split(':').map(Number);
            return h * 60 + m;
        }

        function minutesToHHMM(totalMinutes) {
            if (totalMinutes < 0) return `--:--`;
            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;
            const format = (value) => String(value).padStart(2, '0');
            return `${format(hours)}:${format(minutes)}`;
        }

        function calculateDurations(item) {
            const transitDuration = item.berangkatTransit ? timeToMinutes(item.berangkatTransit) - timeToMinutes(item.sampaiTransit) : null;
            const totalDuration = item.sampaiAkhir ? timeToMinutes(item.sampaiAkhir) - timeToMinutes(item.berangkatAwal) : timeToMinutes(item.sampai) - timeToMinutes(item.berangkat);
            return {
                transit: transitDuration,
                total: totalDuration
            };
        }

        // Render schedule cards
        function renderScheduleCards(data, containerId, isKrl = false) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            if (containerId === 'kereta-schedule-container' && document.querySelector('[data-subtab="pergi"]').classList.contains('bg-white')) {
                const description = document.createElement('div');
                description.className = 'bg-blue-50 border-l-4 border-blue-500 p-4 mb-6 rounded';
                description.innerHTML = `

                        <div class="flex-shrink-0">
                            <i class="fas fa-info-circle text-blue-500"></i>
                        </div>
                        <div class="ml-3">

                            </p>
                        </div>
                    </div>
                `;
                container.appendChild(description);
            }

            data.forEach((item, index) => {
                const durations = calculateDurations(item);
                const card = document.createElement('div');
                card.className = 'train-card bg-white rounded-xl p-4 md:p-6';
                card.dataset.berangkat = isKrl ? item.berangkat : item.berangkatAwal;
                
                if (isKrl) {
                    // Determine route text based on current direction
                    let routeText, fromStation, toStation;
                    if (currentKrlDirection === 'solo-jogja') {
                        routeText = 'Palur → Jogja';
                        fromStation = 'Palur';
                        toStation = 'Jogja';
                    } else {
                        routeText = 'Jogja → Palur';
                        fromStation = 'Jogja';
                        toStation = 'Palur';
                    }

                            <div class="flex justify-between items-start mb-3">
                                <div class="flex items-center">
                                    <div class="w-10 h-10 rounded-full bg-purple-100 flex items-center justify-center mr-3">

                                    </div>

        // Update timer and progress
        function updateTimers() {
            const now = new Date();
            
            // Update Kereta timers
            const keretaCards = document.querySelectorAll('#kereta-schedule-container .train-card');
            let nextKereta = null;
            let nextKeretaElement = null;
            let hasAvailableKereta = false;
            
            keretaCards.forEach(card => {
                const waktuBerangkatStr = card.dataset.berangkat;
                const [hours, minutes] = waktuBerangkatStr.split(':').map(Number);
                let waktuBerangkat = new Date();
                waktuBerangkat.setHours(hours, minutes, 0, 0);
                
                const timerCell = card.querySelector('[data-timer-id^="kereta-schedule-container"]');
                if (now > waktuBerangkat) {
                    card.style.opacity = '0.5';
                    timerCell.textContent = 'Berangkat';
                    timerCell.className = 'text-xl font-bold text-gray-500';
                    
                    // Hide card if filter is active
                    if (!showAllSchedules) {
                        card.style.display = 'none';
                    }
                } else {
                    card.style.opacity = '1';
                    card.style.display = 'block';
                    hasAvailableKereta = true;
                    
                    if (!nextKereta || waktuBerangkat < nextKereta) {
                        nextKereta = waktuBerangkat;
                        nextKeretaElement = card;
                    }
                    
                    const sisaWaktuMs = waktuBerangkat - now;
                    let sisaMenit = Math.max(0, Math.floor(sisaWaktuMs / (1000 * 60)));
                    
                    let timerText;
                    if (sisaMenit >= 60) {
                        const sisaJam = Math.floor(sisaMenit / 60);
                        sisaMenit = sisaMenit % 60;
                        timerText = `${sisaJam}j ${sisaMenit}m`;
                    } else {
                        timerText = `${sisaMenit}m`;
                        
                        // Add urgent class if less than 15 minutes
                        if (sisaMenit <= 15) {
                            timerCell.classList.add('urgent');
                        } else {
                            timerCell.classList.remove('urgent');
                        }
                    }
                    timerCell.textContent = timerText;
                    timerCell.className = 'text-xl font-bold text-indigo-600';
                }
            });
            
            // Update KRL timers
            const krlCards = document.querySelectorAll('#krl-schedule-container .train-card');
            let nextKrl = null;
            let nextKrlElement = null;
            let hasAvailableKrl = false;
            
            krlCards.forEach(card => {
                const waktuBerangkatStr = card.dataset.berangkat;
                const [hours, minutes] = waktuBerangkatStr.split(':').map(Number);
                let waktuBerangkat = new Date();
                waktuBerangkat.setHours(hours, minutes, 0, 0);
                
                const timerCell = card.querySelector('[data-timer-id^="krl-schedule-container"]');
                if (now > waktuBerangkat) {
                    card.style.opacity = '0.5';
                    timerCell.textContent = 'Berangkat';
                    timerCell.className = 'text-xl font-bold text-gray-500';
                    
                    // Hide card if filter is active
                    if (!showAllSchedules) {
                        card.style.display = 'none';
                    }
                } else {
                    card.style.opacity = '1';
                    card.style.display = 'block';
                    hasAvailableKrl = true;
                    
                    if (!nextKrl || waktuBerangkat < nextKrl) {
                        nextKrl = waktuBerangkat;
                        nextKrlElement = card;
                    }
                    
                    const sisaWaktuMs = waktuBerangkat - now;
                    let sisaMenit = Math.max(0, Math.floor(sisaWaktuMs / (1000 * 60)));
                    
                    let timerText;
                    if (sisaMenit >= 60) {
                        const sisaJam = Math.floor(sisaMenit / 60);
                        sisaMenit = sisaMenit % 60;
                        timerText = `${sisaJam}j ${sisaMenit}m`;
                    } else {
                        timerText = `${sisaMenit}m`;
                        
                        // Add urgent class if less than 15 minutes
                        if (sisaMenit <= 15) {
                            timerCell.classList.add('urgent');
                        } else {
                            timerCell.classList.remove('urgent');
                        }
                    }
                    timerCell.textContent = timerText;
                    timerCell.className = 'text-xl font-bold text-indigo-600';
                }
            });
            
            // Update next train info for Kereta
            if (nextKeretaElement) {
                const sisaWaktuMs = nextKereta - now;
                const sisaJam = Math.floor(sisaWaktuMs / (1000 * 60 * 60));
                const sisaMenit = Math.floor((sisaWaktuMs % (1000 * 60 * 60)) / (1000 * 60));
                const sisaDetik = Math.floor((sisaWaktuMs % (1000 * 60)) / 1000);
                
                document.getElementById('kereta-next-time').textContent = nextKeretaElement.dataset.berangkat;
                document.getElementById('kereta-countdown').textContent = `${sisaJam.toString().padStart(2, '0')}:${sisaMenit.toString().padStart(2, '0')}:${sisaDetik.toString().padStart(2, '0')}`;
                
                let progressWidth = 0;
                const sisaTotalMenit = sisaJam * 60 + sisaMenit + sisaDetik/60;
                const maxProgressMinutes = 120;
                if (sisaTotalMenit <= maxProgressMinutes) {
                    progressWidth = (sisaTotalMenit / maxProgressMinutes) * 100;
                }
                document.getElementById('kereta-progress').style.width = `${progressWidth}%`;
            } else {
                if (!hasAvailableKereta) {
                    document.getElementById('kereta-next-time').textContent = '⚠️';
                    document.getElementById('kereta-countdown').textContent = 'Jadwal Kereta hari ini sudah habis!';
                } else {
                    document.getElementById('kereta-next-time').textContent = '--:--';
                    document.getElementById('kereta-countdown').textContent = '--:--:--';
                }
                document.getElementById('kereta-progress').style.width = '0%';
            }
            
            // Update next train info for KRL
            if (nextKrlElement) {
                const sisaWaktuMs = nextKrl - now;
                const sisaJam = Math.floor(sisaWaktuMs / (1000 * 60 * 60));
                const sisaMenit = Math.floor((sisaWaktuMs % (1000 * 60 * 60)) / (1000 * 60));
                const sisaDetik = Math.floor((sisaWaktuMs % (1000 * 60)) / 1000);
                
                document.getElementById('krl-next-time').textContent = nextKrlElement.dataset.berangkat;
                document.getElementById('krl-countdown').textContent = `${sisaJam.toString().padStart(2, '0')}:${sisaMenit.toString().padStart(2, '0')}:${sisaDetik.toString().padStart(2, '0')}`;
                
                let progressWidth = 0;
                const sisaTotalMenit = sisaJam * 60 + sisaMenit + sisaDetik/60;
                const maxProgressMinutes = 120;
                if (sisaTotalMenit <= maxProgressMinutes) {
                    progressWidth = (sisaTotalMenit / maxProgressMinutes) * 100;
                }
                document.getElementById('krl-progress').style.width = `${progressWidth}%`;
            } else {
                if (!hasAvailableKrl) {
                    document.getElementById('krl-next-time').textContent = '⚠️';
                    document.getElementById('krl-countdown').textContent = 'Jadwal Kereta hari ini sudah habis!';
                } else {
                    document.getElementById('krl-next-time').textContent = '--:--';
                    document.getElementById('krl-countdown').textContent = '--:--:--';
                }
                document.getElementById('krl-progress').style.width = '0%';
            }
        }

        // Tab functionality
        function setupTabs() {
            const tabButtons = document.querySelectorAll('.tab-btn');
            const tabIndicator = document.getElementById('tabIndicator');
            const keretaTab = document.getElementById('kereta-tab');
            const krlTab = document.getElementById('krl-tab');
            
            // Set initial indicator position to KRL tab (left)
            const krlTabButton = document.querySelector('[data-tab="krl"]');
            if (krlTabButton) {
                tabIndicator.style.width = `${krlTabButton.offsetWidth}px`;
                tabIndicator.style.left = `${krlTabButton.offsetLeft}px`;
            }
            
            tabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    // Update indicator
                    tabIndicator.style.width = `${button.offsetWidth}px`;
                    tabIndicator.style.left = `${button.offsetLeft}px`;
                    
                    // Update active states
                    tabButtons.forEach(btn => btn.classList.remove('text-indigo-600', 'font-semibold'));
                    button.classList.add('text-indigo-600', 'font-semibold');
                    
                    // Show/hide content
                    if (button.dataset.tab === 'kereta') {
                        keretaTab.classList.remove('hidden');
                        krlTab.classList.add('hidden');
                    } else {
                        keretaTab.classList.add('hidden');
                        krlTab.classList.remove('hidden');
                    }
                });
            });
        }

        // Sub-tab functionality
        function setupSubTabs() {
            // Kereta sub-tabs
            const keretaSubTabs = document.querySelectorAll('.sub-tab-btn');
            keretaSubTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    keretaSubTabs.forEach(t => {
                        t.classList.remove('bg-white', 'text-indigo-600', 'shadow-sm');
                    });
                    tab.classList.add('bg-white', 'text-indigo-600', 'shadow-sm');
                    
                    // Update current direction
                    currentKeretaDirection = tab.dataset.subtab;
                    
                    // Update route text in the next train info
                    if (currentKeretaDirection === 'pergi') {
                        document.getElementById('kereta-next-route').textContent = 'SRAGEN → JOGJA';
                    } else {
                        document.getElementById('kereta-next-route').textContent = 'JOGJA → SRAGEN';
                    }
                    
                    if (tab.dataset.subtab === 'pergi') {
                        renderScheduleCards(jadwalPergi, 'kereta-schedule-container');
                    } else {
                        renderScheduleCards(jadwalPulang, 'kereta-schedule-container');
                    }
                });
            });
            
            // KRL sub-tabs
            const krlSubTabs = document.querySelectorAll('.krl-sub-tab-btn');
            krlSubTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    krlSubTabs.forEach(t => {
                        t.classList.remove('bg-white', 'text-indigo-600', 'shadow-sm');
                    });
                    tab.classList.add('bg-white', 'text-indigo-600', 'shadow-sm');
                    
                    // Update current direction
                    currentKrlDirection = tab.dataset.subtab;
                    
                    // Update route text in the next train info
                    if (currentKrlDirection === 'solo-jogja') {
                        document.getElementById('krl-next-route').textContent = 'PALUR → JOGJA';
                    } else {
                        document.getElementById('krl-next-route').textContent = 'JOGJA → PALUR';
                    }
                    
                    if (tab.dataset.subtab === 'solo-jogja') {
                        renderScheduleCards(jadwalKrlSoloJogja, 'krl-schedule-container', true);
                    } else {
                        renderScheduleCards(jadwalKrlJogjaSolo, 'krl-schedule-container', true);
                    }
                });
            });
            
            // Set initial active sub-tab
            krlSubTabs[0].click();
            keretaSubTabs[0].click();
        }

        // Filter toggle functionality
        function setupFilterToggle() {
            const filterToggle = document.getElementById('filterToggle');
            const icon = filterToggle.querySelector('i');
            
            filterToggle.addEventListener('click', () => {
                showAllSchedules = !showAllSchedules;
                
                if (showAllSchedules) {
                    icon.classList.remove('fa-clock');
                    icon.classList.add('fa-filter');
                    filterToggle.title = "Tampilkan semua jadwal";
                } else {
                    icon.classList.remove('fa-filter');
                    icon.classList.add('fa-clock');
                    filterToggle.title = "Hanya kereta yang tersedia";
                }
                
                // Refresh the current view
                const activeTab = document.querySelector('.tab-content:not(.hidden)');
                if (activeTab.id === 'kereta-tab') {
                    const activeSubTab = document.querySelector('.sub-tab-btn.bg-white');
                    if (activeSubTab) {
                        activeSubTab.click();
                    }
                } else {
                    const activeSubTab = document.querySelector('.krl-sub-tab-btn.bg-white');
                    if (activeSubTab) {
                        activeSubTab.click();
                    }
                }
            });
        }

        // Initialize everything
        document.addEventListener('DOMContentLoaded', () => {
            setupTabs();
            setupSubTabs();
            setupFilterToggle();
            
            // Initial render
            renderScheduleCards(jadwalKrlSoloJogja, 'krl-schedule-container', true);
            renderScheduleCards(jadwalPergi, 'kereta-schedule-container');
            
            // Update timers every second
            updateTimers();
            setInterval(updateTimers, 1000);
            
            // Add fade-in animation to elements
            const fadeElements = document.querySelectorAll('.fade-in');
            fadeElements.forEach((el, index) => {
                setTimeout(() => {
                    el.style.opacity = '1';
                }, index * 100);
            });
        });
    </script>
</body>
</html>
